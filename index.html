<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>MyColoc — Connexion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Font (Apple-like) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b0b0f;
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-card-hover: rgba(255, 255, 255, 0.09);
      --text-main: #ffffff;
      --text-secondary: #b3b3b3;
      --accent: #ff2d55; /* Apple Music pink */
      --border: rgba(255,255,255,0.12);
      --radius: 18px;
      --blur: blur(18px);
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,45,85,0.12), transparent 40%),
        radial-gradient(circle at bottom right, rgba(90,200,250,0.12), transparent 40%),
        var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      background: var(--bg-card);
      backdrop-filter: var(--blur);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input {
      padding: 14px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
    }

    input::placeholder {
      color: var(--text-secondary);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.12);
    }

    button {
      margin-top: 10px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .switch {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .switch span {
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }

    .error {
      margin-top: 12px;
      font-size: 13px;
      color: #ff453a;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">
      <h1>MyColoc</h1>
      <p>Gérez votre colocation simplement</p>
    </div>

    <form id="auth-form">
      <input type="email" id="email" placeholder="Adresse email" required />
      <input type="password" id="password" placeholder="Mot de passe" required />

      <button type="submit" id="submit-btn">Se connecter</button>
      <button type="button" class="secondary" id="toggle-btn">
        Créer un compte
      </button>
    </form>

    <div class="error" id="error-msg"></div>

    <div class="switch">
      <span id="mode-text">Connexion</span>
    </div>
  </div>

  <script>
    /* 🔧 CONFIG SUPABASE */
    const sb = window.supabase.createClient(
      'https://thcsbtvbybhmmiabovjc.supabase.co',
      'sb_publishable_zo99H00Em3C_cpF4hV3c4A_inn52lP2'
    )

    let isLogin = true

    const form = document.getElementById('auth-form')
    const toggleBtn = document.getElementById('toggle-btn')
    const submitBtn = document.getElementById('submit-btn')
    const modeText = document.getElementById('mode-text')
    const errorMsg = document.getElementById('error-msg')

    toggleBtn.addEventListener('click', () => {
      isLogin = !isLogin
      submitBtn.textContent = isLogin ? 'Se connecter' : 'Créer le compte'
      toggleBtn.textContent = isLogin ? 'Créer un compte' : 'Retour à la connexion'
      modeText.textContent = isLogin ? 'Connexion' : 'Inscription'
      errorMsg.style.display = 'none'
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorMsg.style.display = 'none'

      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      let response

      if (isLogin) {
        response = await sb.auth.signInWithPassword({
          email,
          password
        })
      } else {
        response = await sb.auth.signUp({
          email,
          password
        })
      }

      if (response.error) {
        errorMsg.textContent = response.error.message
        errorMsg.style.display = 'block'
        return
      }

      window.location.href = 'home.html'
    })
  </script>

</body>
</html>
